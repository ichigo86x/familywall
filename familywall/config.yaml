name: Familywall
version: "0.8.0"
slug: familywall
description: Calendario, menu, liste e turni della famiglia, con ruoli e pannello a muro.
url: https://github.com/ichigo86x/familywall
arch:
  - amd64
  - aarch64
# Images published by the GitHub workflow; `npm run addon:stage` removes this line for a local build.
image: ghcr.io/ichigo86x/{arch}-addon-familywall
startup: application
boot: auto
init: true
# Lets the dashboard buttons call Home Assistant services (door opener, intercom...) through the Supervisor.
homeassistant_api: true
ingress: true
ingress_port: 3001
panel_icon: mdi:calendar-heart
panel_title: Familywall
# Direct port for the external nginx reverse proxy (iOS web app, tablets, Echo Show).
ports:
  3001/tcp: 3001
ports_description:
  3001/tcp: Accesso diretto per il reverse proxy (lascia vuoto per usare solo il pannello di Home Assistant)
options: {}
schema: {}
