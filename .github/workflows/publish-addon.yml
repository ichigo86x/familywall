# Builds the add-on images and publishes them on GitHub Container Registry, where Home Assistant
# downloads them (config.yaml: image: ghcr.io/ichigo86x/{arch}-addon-familywall).
# Run it by pushing a tag with the new version, e.g. v0.9.1. Only after every image is published the
# workflow writes that version in familywall/config.yaml on main: Home Assistant offers an update only
# when its images can already be downloaded.
name: Publish add-on

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - id: read
        name: Read the version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag ${GITHUB_REF_NAME} is not vX.Y.Z" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_VERSION=${{ needs.version.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-familywall:${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-familywall:latest
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Announce the version to Home Assistant
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed -i "s/^version: .*/version: \"$VERSION\"/" familywall/config.yaml
          if git diff --quiet; then
            echo "familywall/config.yaml already at $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release $VERSION"
          git push origin HEAD:main
