<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Familywall</title>
    <meta name="description" content="Calendario e organizzazione della famiglia." />
    <meta name="theme-color" content="#3A7D6E" />
    <!-- Applies the saved/device theme and text size before the first paint (no flash on wall panels). -->
    <script>
      (function () {
        var pref = "auto";
        try { pref = localStorage.getItem("familywall.theme") || "auto"; } catch (e) {}
        var dark = pref === "dark" || (pref !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        // Text size (see theme-preference.tsx): applied early so the first paint is already scaled.
        var scale = null;
        try { scale = new URLSearchParams(location.search).get("scale") || localStorage.getItem("familywall.scale"); } catch (e) {}
        var long = Math.max(innerWidth, innerHeight), short = Math.min(innerWidth, innerHeight);
        var factor = scale && scale !== "auto" ? Number(scale) / 100 : long >= 1800 && short >= 950 ? 1.3 : long >= 1500 && short >= 800 ? 1.15 : 1;
        if (factor > 0 && factor !== 1) document.documentElement.style.fontSize = 16 * factor + "px";
      })();
    </script>

    <!-- Installable web app (iOS "Aggiungi a Home", Android, tablets). Paths stay relative for HA ingress. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Familywall" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
