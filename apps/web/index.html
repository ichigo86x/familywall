<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Familywall</title>
    <meta name="description" content="Calendario e organizzazione della famiglia." />
    <meta name="theme-color" content="#3A7D6E" />
    <!-- Applies the saved/device theme before the first paint (no light flash on dark panels). -->
    <script>
      (function () {
        var pref = "auto";
        try { pref = localStorage.getItem("familywall.theme") || "auto"; } catch (e) {}
        var dark = pref === "dark" || (pref !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>

    <!-- Installable web app (iOS "Aggiungi a Home", Android, tablets). Paths stay relative for HA ingress. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Familywall" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
